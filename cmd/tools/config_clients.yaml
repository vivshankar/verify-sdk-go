# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: openapi
output: ../../internal/openapi/openapi_clients.gen.go
generate:
  models: false
  client: true
additional-imports:
  - alias: .
    package: github.com/ibm-verify/verify-sdk-go/pkg/core/models
compatibility:
  disable-required-readonly-as-pointer: true
  always-prefix-enum-values: true
output-options:
  nullable-type: false
  name-normalizer: "ToCamelCaseWithInitialisms"
  response-type-suffix: "Object"
  prefer-skip-optional-pointer-on-container-types: true
  yaml-tags: true
  